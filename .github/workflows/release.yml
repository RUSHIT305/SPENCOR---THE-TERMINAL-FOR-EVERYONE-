name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish verified Linux package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev \
            desktop-file-utils appstream appstream-compose
      - name: Validate Linux metadata
        run: |
          desktop-file-validate packaging/linux/io.github.rushit305.spencer.desktop
          appstreamcli validate --no-net packaging/linux/io.github.rushit305.spencer.metainfo.xml
      - name: Configure, build, and test release
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release --output-on-failure
      - name: Create Debian package and checksum
        run: |
          cpack --config build/release/CPackConfig.cmake -G DEB
          cd build/release
          sha256sum *.deb > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "SPENCER ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            build/release/*.deb build/release/SHA256SUMS.txt
